<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>米家插件实验宿主</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; background:#ececec; font-family:"MiSans","MiSans VF","HarmonyOS Sans SC","HarmonyOS Sans","Noto Sans CJK SC",sans-serif; overflow:hidden; -webkit-text-size-adjust:100%; }
    #rn-banner { display:none; position:fixed; top:0; left:0; right:0; z-index:9999; background:#ff9800; color:#000; font-size:13px; padding:8px 10px; font-weight:600; }
    #rn-root { position:fixed; left:0; right:0; top:0; bottom:0; overflow:hidden; background:#f5f5f5; display:flex; flex-direction:column; box-sizing:border-box; }
    #rn-log-wrap { position:fixed; left:0; right:0; bottom:0; z-index:10000; pointer-events:none; }
    #rn-log-wrap > * { pointer-events:auto; }
    #rn-log-wrap.collapsed #rn-log-bar { display:inline-block; opacity:0.35; font-size:9px; padding:1px 4px; border-top-right-radius:4px; }
    #rn-log-bar { background:rgba(0,0,0,0.55); color:#9f9; font:11px/1.2 monospace; padding:4px 8px; cursor:pointer; user-select:none; }
    #rn-log { margin:0; max-height:36vh; overflow:auto; background:rgba(0,0,0,0.72); color:#00ff66; font:11px/1.35 monospace; padding:6px 8px; white-space:pre-wrap; word-break:break-all; display:none; }
    #rn-log-wrap.expanded #rn-log { display:block; }
    #rn-log-wrap.collapsed #rn-log { display:none; }
  </style>
</head>
<body>
  <div id="rn-banner">米家原版插件（实验）— 若只有本条橙色，说明 HTML 已加载</div>
  <div id="rn-root"><div id="rn-placeholder" style="display:none"></div></div>
  <div id="rn-log-wrap" class="collapsed">
    <div id="rn-log-bar">日志 ▸ 点击展开/收起</div>
    <pre id="rn-log">[inline] html parsed
</pre>
  </div>
  <script>
    (function () {
      var wrap = document.getElementById('rn-log-wrap');
      var bar = document.getElementById('rn-log-bar');
      var collapsed = true;
      function syncBar() {
        bar.textContent = collapsed ? '日志' : '日志 ▾ 点击收起';
        wrap.className = collapsed ? 'collapsed' : 'expanded';
        var root = document.getElementById('rn-root');
        if (root) root.style.bottom = collapsed ? '0px' : '40vh';
      }
      bar.addEventListener('click', function () { collapsed = !collapsed; syncBar(); });
      syncBar();

      function append(msg) {
        try {
          var el = document.getElementById('rn-log');
          var line = String(msg);
          if (el) {
            el.textContent = (el.textContent || '') + line + '\n';
            el.scrollTop = el.scrollHeight;
          }
          if (typeof console !== 'undefined' && console.log) console.log('[RNHostUI]', line);
        } catch (e) {}
      }
      window.__RNHostQuiet = true;
      window.__appendLog = append;
      window.__perfT0 = (performance && performance.now) ? performance.now() : Date.now();
      window.__clearRnPlaceholder = function () {
        var ph = document.getElementById('rn-placeholder');
        if (ph && ph.parentNode) ph.parentNode.removeChild(ph);
        var root = document.getElementById('rn-root');
        if (root) root.setAttribute('data-rn-ready', '1');
      };
      window.onerror = function (msg, src, line, col, err) {
        append('ONERROR ' + msg + ' @' + src + ':' + line + ':' + col);
        if (err && err.stack) append(String(err.stack));
        return false;
      };
      window.addEventListener('unhandledrejection', function (ev) {
        append('UNHANDLED ' + (ev.reason && (ev.reason.stack || ev.reason)));
      });
      append('loc=' + location.href);
      try {
        if (location.origin && location.origin.indexOf('rnhost.local') >= 0) {
          window.__bundleUrls = {
            sdk: location.origin + '/sdk/sdk.bundle',
            host: location.origin + '/rnhost/host.js',
            boot: location.origin + '/rnhost/boot.js'
          };
          append('bundleUrls https origin');
        }
      } catch (_bu) {}
      append('UA=' + (navigator.userAgent || ''));

      function param(name) {
        var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
        return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
      }

      var HostPromise = window.Promise;
      function loadScript(src) {
        return new HostPromise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = function () { append('script ok ' + src); resolve(); };
          s.onerror = function () { append('script FAIL ' + src); reject(new Error('script fail ' + src)); };
          document.head.appendChild(s);
        });
      }

      function notifyFail(msg) {
        try {
          if (window.RNHostBridge && window.RNHostBridge.invoke) {
            window.RNHostBridge.invoke(JSON.stringify({ id: 0, action: 'bootFailed', payload: { msg: String(msg).slice(0, 300) } }));
          }
        } catch (_e) {}
      }
      window.addEventListener('error', function (ev) {
        if (!window.__pluginBootStarted) return;
        var msg = String(ev && ev.message || '');
        if (/script fail|script onerror/.test(msg)) notifyFail(msg);
      });

      window.startPluginHost = function () {
        if (window.__pluginBootStarted) { append('start ignored (already)'); return; }
        window.__pluginBootStarted = true;
        append('startPluginHost()');
        try {
          if (window.RNHostBridge) {
            window.__RNHost.installBridgeProxy(window.RNHostBridge);
            append('bridge proxy installed');
          } else {
            append('WARN: RNHostBridge missing (javaScriptProxy?)');
          }
          var d = window.__deviceFromArk || {};
          var pl = window.__pluginFromArk || {};
          var device = {
            did: d.did || param('did') || '1046841160',
            model: d.model || param('model') || 'philips.light.lite',
            name: d.name || param('name') || '设备',
            isOnline: d.isOnline !== false,
            pid: Number(d.pid || 0),
            deviceID: d.did || param('did') || '1046841160'
          };
          append('device ' + JSON.stringify(device) + ' plugin ' + JSON.stringify(pl));
          if (!window.__RNHost || !window.__RNHost.loadAndRun) {
            append('FATAL: __RNHost.loadAndRun missing — host/boot not loaded');
            return;
          }
          var plugBase = pl.base || 'plugin/';
          var sdkUrl = (window.__bundleUrls && window.__bundleUrls.sdk) || 'sdk/sdk.bundle';
          var pluginUrl = plugBase + 'main.bundle';
          append('script sdk=' + sdkUrl);
          append('script plugin=' + pluginUrl);
          var resReady = pl.resFilesJs ? loadScript(pl.resFilesJs).catch(function () { append('plugin files.js missing'); }) : Promise.resolve();
          resReady.then(function () {
          window.__clearRnPlaceholder();
          try {
            if (window.__sdkWarmed || pl.skipSdk) {
              var nt = window.__RNHost && window.__RNHost.nativeTimers;
              if (nt && window.__RNHost._pumpId == null) {
                window.__RNHost._pumpId = nt.setInterval(function () {
                  try { window.__RNHost.pollQueue(); } catch (_p) {}
                }, 8);
              }
            }
          } catch (_pump) {}
          return window.__RNHost.loadAndRun({
            sdkUrl: sdkUrl,
            pluginUrl: pluginUrl,
            packageName: pl.packageName || param('package') || 'miot.plugin.prototype',
            entries: pl.entries,
            plugin: pl,
            device: device,
            rootTag: 11,
            skipSdk: !!(window.__sdkWarmed || pl.skipSdk)
          });
          }).then(function (snap) {
            append('boot ok, views=' + (snap && snap.length));
            try { var m = window.__RNHost && window.__RNHost.marks; if (m) append('PERF marks ' + JSON.stringify(m)); } catch(_e) {}
            window.__clearRnPlaceholder();
            if (snap && snap.length === 0) notifyFail('插件已启动但没有渲染任何界面');
          }).catch(function (e) {
            append('boot FAILED: ' + (e && e.stack || e));
            var root = document.getElementById('rn-root');
            if (root) root.innerHTML = '<div style="padding:24px;color:#c00;font-size:14px">插件加载失败<br/>' +
              String(e && e.message || e) + '</div>';
            notifyFail(String(e && e.message || e));
          });
        } catch (e) {
          append('startPluginHost throw: ' + (e && e.stack || e));
        }
      };

      append('loading res/files.js + host.js / boot.js …');
      var bu = window.__bundleUrls || {};
      loadScript('plugin/res/files.js').catch(function () { append('files.js missing (images may 404)'); })
        .then(function () { return loadScript(bu.host || 'rnhost/host.js'); })
        .then(function () { return loadScript(bu.boot || 'rnhost/boot.js'); })
        .then(function () {
          append('host+boot ready; waiting ArkTS kick or auto-start');
          var warm = param('warm') === '1' || window.__warmMode === true;
          if (warm) {
            window.__warmMode = true;
            append('WARM mode: loading sdk only');
            if (!window.__RNHost || !window.__RNHost.warmSdk) {
              append('FATAL: warmSdk missing');
              return;
            }
            return window.__RNHost.warmSdk((window.__bundleUrls && window.__bundleUrls.sdk) || 'sdk/sdk.bundle')
              .then(function () {
                window.__sdkWarmed = true;
                append('WARM sdk ready');
                try {
                  if (window.RNHostBridge && window.RNHostBridge.invoke) {
                    window.RNHostBridge.invoke(JSON.stringify({ id: 0, action: 'warmReady', payload: {} }));
                  }
                } catch (_e) {}
              })
              .catch(function (e) { append('WARM FAILED ' + (e && e.stack || e)); });
          }
          if (window.__kickFromArk) {
            window.startPluginHost();
          } else if (window.RNHostBridge) {
            append('waiting ArkTS kick (plugin download / cache)');
          } else if (!warm) {
            setTimeout(function () {
              if (!window.__pluginBootStarted) {
                append('auto-start after timeout');
                window.startPluginHost();
              }
            }, 400);
          }
        })
        .catch(function (e) {
          append(String(e && e.message || e));
        });
    })();
  </script>
</body>
</html>
